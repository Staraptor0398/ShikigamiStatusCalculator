name: GuiTest

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gui-test:
    runs-on: windows-2025-vs2026
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v3
        with:
          msbuild-architecture: x64

      - name: Setup NuGet
        uses: nuget/setup-nuget@v3
        with:
          nuget-version: latest

      - name: Restore SaveData packages
        shell: pwsh
        run: nuget restore SaveData\packages.config -PackagesDirectory packages

      - name: Restore GuiTest packages
        shell: pwsh
        run: msbuild GuiTest\GuiTest.csproj /t:Restore /p:Configuration=Debug /p:Platform=x64

      - name: Build GuiTest
        shell: pwsh
        run: |
          msbuild Gui_Test.slnx /m /p:Configuration=Debug /p:Platform=x64 /p:WindowsTargetPlatformVersion=10.0

          if ($LASTEXITCODE -ne 0) {
              throw "GuiTest build failed with exit code $LASTEXITCODE."
          }

      - name: Verify binary
        shell: pwsh
        run: |
          $assemblies = @(
              Get-ChildItem "GuiTest\bin" -Recurse -Filter "GuiTest.dll" -File
          )

          if ($assemblies.Count -ne 1) {
              throw "Expected one GuiTest.dll, found $($assemblies.Count)."
          }

      - name: Run GuiTest
        shell: pwsh
        run: |
          $testAssembly = @(
              Get-ChildItem "GuiTest\bin" -Recurse -Filter "GuiTest.dll" -File
          )[0].FullName

          $vsTest = vswhere -latest -products * -find "**\vstest.console.exe" |
              Select-Object -First 1

          if ([string]::IsNullOrWhiteSpace($vsTest)) {
              throw "vstest.console.exe was not found."
          }

          & $vsTest `
              $testAssembly `
              "/Platform:x64" `
              "/Logger:trx;LogFileName=GuiTest.trx" `
              "/ResultsDirectory:TestResults"

          if ($LASTEXITCODE -ne 0) {
              throw "GuiTest failed with exit code $LASTEXITCODE."
          }

          $resultPath = "TestResults\GuiTest.trx"

          if (-not (Test-Path $resultPath)) {
              throw "GuiTest TRX result was not created."
          }

          [xml]$result = Get-Content $resultPath -Raw
          $counters = $result.TestRun.ResultSummary.Counters

          if ([int]$counters.total -eq 0) {
              throw "No GuiTest cases were executed."
          }

          Write-Host "GuiTest completed successfully. Tests: $($counters.total)"

      - name: Upload GuiTest results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gui-test-results
          path: TestResults\GuiTest.trx
          if-no-files-found: warn
