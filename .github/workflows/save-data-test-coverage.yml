name: SaveDataTest Coverage

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  save-data-test-coverage:
    runs-on: windows-2025-vs2026
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v3
        with:
          msbuild-architecture: x64

      - name: Restore SaveDataTest packages
        shell: pwsh
        run: |
          msbuild SaveDataTest\SaveDataTest.csproj /t:Restore /p:Configuration=Debug /p:Platform=x64

          if ($LASTEXITCODE -ne 0) {
              throw "SaveDataTest package restore failed with exit code $LASTEXITCODE."
          }

      - name: Build SaveDataTest
        shell: pwsh
        run: |
          msbuild SaveData_Test.slnx /m /p:Configuration=Debug /p:Platform=x64

          if ($LASTEXITCODE -ne 0) {
              throw "SaveDataTest build failed with exit code $LASTEXITCODE."
          }

      - name: Verify coverage inputs
        shell: pwsh
        run: |
          $required = @(
              ".\Script\Measure-SaveDataTestCoverage.ps1",
              ".\Script\SaveDataTestCoverage.runsettings"
          )

          foreach ($path in $required) {
              if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
                  throw "Required coverage input was not found: $path"
              }
          }

          $assemblies = @(
              Get-ChildItem "SaveDataTest\bin" -Recurse -Filter "SaveDataTest.dll" -File
          )

          if ($assemblies.Count -ne 1) {
              throw "Expected one SaveDataTest.dll, found $($assemblies.Count)."
          }

      - name: Measure SaveDataTest coverage
        shell: pwsh
        run: |
          $testAssembly = @(
              Get-ChildItem "SaveDataTest\bin" -Recurse -Filter "SaveDataTest.dll" -File
          )[0].FullName

          & .\Script\Measure-SaveDataTestCoverage.ps1 `
              -TestAssemblyPath $testAssembly `
              -RunSettingsPath ".\Script\SaveDataTestCoverage.runsettings" `
              -OutputDirectory ".\TestResults\SaveDataTestCoverage"

          $exitCode = $LASTEXITCODE
          if ($exitCode -ne 0) {
              throw "SaveDataTest coverage script failed with exit code $exitCode (1=test, 2=measurement)."
          }

      - name: Verify tests and coverage report
        shell: pwsh
        run: |
          $directory = ".\TestResults\SaveDataTestCoverage"
          $trxPath = Join-Path $directory "SaveDataTest.trx"
          $coveragePath = Join-Path $directory "SaveDataTest.coverage"
          $coberturaPath = Join-Path $directory "SaveDataTest.cobertura.xml"
          $xmlPath = Join-Path $directory "SaveDataTest.coverage.xml"
          $summaryPath = Join-Path $directory "SaveDataCoverageSummary.txt"

          foreach ($path in @($trxPath, $coveragePath, $coberturaPath, $xmlPath, $summaryPath)) {
              if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
                  throw "Required result file was not produced: $path"
              }
              if ((Get-Item -LiteralPath $path).Length -eq 0) {
                  throw "Result file is empty: $path"
              }
          }

          [xml]$trx = Get-Content -LiteralPath $trxPath -Raw
          $counters = $trx.TestRun.ResultSummary.Counters
          $total = [int]$counters.total
          $passed = [int]$counters.passed
          $failed = [int]$counters.failed
          $notExecuted = [int]$counters.notExecuted

          if ($total -le 0 -or $failed -ne 0 -or $notExecuted -ne 0 -or $passed -ne $total) {
              throw "Invalid test results: total=$total, passed=$passed, failed=$failed, notExecuted=$notExecuted."
          }

          [xml]$coverage = Get-Content -LiteralPath $coberturaPath -Raw
          $classes = @($coverage.SelectNodes('//class'))
          $unexpected = @($classes | Where-Object {
              $path = ([string]$_.GetAttribute('filename')) -replace '/', '\'
              $path -notmatch '(?i)(^|\)SaveData\' -or $path -match '(?i)(^|\)SaveDataTest\'
          })
          if ($classes.Count -eq 0 -or $unexpected.Count -ne 0) {
              throw "Cobertura must contain SaveData source files only; classes=$($classes.Count), unexpected=$($unexpected.Count)."
          }

          $valid = [int]$coverage.coverage.'lines-valid'
          $covered = [int]$coverage.coverage.'lines-covered'
          if ($valid -le 0 -or $covered -gt $valid) {
              throw "Invalid Cobertura totals: covered=$covered, valid=$valid."
          }

          $summary = Get-Content -LiteralPath $summaryPath -Raw
          if ($summary -notmatch 'SaveData lines valid:\s*(\d+)' -or [int]$Matches[1] -ne $valid) {
              throw "Coverage summary and Cobertura valid line count do not match."
          }
          if ($summary -notmatch 'SaveData lines covered:\s*(\d+)' -or [int]$Matches[1] -ne $covered) {
              throw "Coverage summary and Cobertura covered line count do not match."
          }
          if ($summary -notmatch 'SaveDataTest/third-party filename refs in report:\s*0\b') {
              throw "Unexpected test/third-party source files are present in the report."
          }

          $rate = [math]::Round(100 * $covered / $valid, 2)
          Write-Host "SaveDataTest: $passed/$total passed. SaveData line coverage: $rate% ($covered/$valid)."
          Write-Host $summary

          @(
              '## SaveDataTest Coverage',
              '',
              "- Test cases: $passed/$total passed",
              "- SaveData source entries: $($classes.Count)",
              "- SaveData line coverage: $rate% ($covered/$valid)",
              '',
              '```text',
              $summary.TrimEnd(),
              '```'
          ) | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Encoding utf8

      - name: Upload SaveDataTest coverage artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: save-data-test-coverage
          path: TestResults/SaveDataTestCoverage/
          if-no-files-found: warn
          retention-days: 14
