name: Runner Reroll Test

on:
  workflow_dispatch:
    inputs:
      selection_mode:
        description: "Runner selection strategy"
        required: true
        default: Unknown
        type: choice
        options:
          - Unknown
          - Fastest
          - Target

permissions:
  contents: read
  actions: read

jobs:
  candidate:
    name: Candidate ${{ matrix.id }}
    runs-on: windows-2025-vs2026
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        id: [1, 2, 3, 4, 5]

    env:
      GH_TOKEN: ${{ github.token }}
      CANDIDATE_ID: ${{ matrix.id }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Measure runner performance
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          & ".\Script\MeasureRunnerPerformance.ps1" `
              -Iterations 7 `
              -OutputDirectory "RunnerPerformance"

      - name: Prepare candidate metadata
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $environment = Get-Content `
              "RunnerPerformance/Environment.json" -Raw |
              ConvertFrom-Json
          $benchmark = Get-Content `
              "RunnerPerformance/Benchmark.json" -Raw |
              ConvertFrom-Json

          $result = [ordered]@{
              CandidateId = [int]$env:CANDIDATE_ID
              CpuName = $environment.CPUName.Trim()
              RunnerName = $environment.RunnerName
              RunnerImage = $environment.RunnerImageVersion
              LogicalProcessors = $environment.LogicalProcessors
              Sha256MedianMs = $benchmark.CPU.MedianMs
              ProcessStartupMedianMs = $benchmark.ProcessStartup.MedianMs
              TimestampUtc = [DateTime]::UtcNow.ToString("o")
          }

          New-Item -ItemType Directory -Force `
              -Path "RunnerCandidate" | Out-Null

          $result |
              ConvertTo-Json -Depth 5 |
              Set-Content "RunnerCandidate/result.json" -Encoding utf8

          Write-Host "Candidate: $env:CANDIDATE_ID"
          Write-Host "CPU: $($result.CpuName)"
          Write-Host "Runner: $($result.RunnerName)"
          Write-Host "SHA256 median: $($result.Sha256MedianMs) ms"
          Write-Host "Process startup median: $($result.ProcessStartupMedianMs) ms"

      - name: Publish candidate
        uses: actions/upload-artifact@v4
        with:
          name: runner-candidate-${{ matrix.id }}
          path: |
            RunnerCandidate/result.json
            RunnerPerformance/Environment.json
            RunnerPerformance/Benchmark.json
          retention-days: 7
          if-no-files-found: error

      - name: Wait for selection
        id: selection
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $repository = $env:GITHUB_REPOSITORY
          $runId = $env:GITHUB_RUN_ID
          $candidateId = [int]$env:CANDIDATE_ID
          $selectionDirectory = Join-Path $env:RUNNER_TEMP "RunnerSelection"
          $deadline = [DateTime]::UtcNow.AddMinutes(8)
          $selection = $null

          while ([DateTime]::UtcNow -lt $deadline) {
              $artifacts = gh api `
                  "repos/$repository/actions/runs/$runId/artifacts" |
                  ConvertFrom-Json

              if ($LASTEXITCODE -ne 0) {
                  throw "Failed to list workflow artifacts."
              }

              $decision = $artifacts.artifacts |
                  Where-Object {
                      $_.name -eq "runner-selection" -and
                      -not $_.expired
                  } |
                  Select-Object -First 1

              if ($null -ne $decision) {
                  try {
                      New-Item -ItemType Directory -Force `
                          -Path $selectionDirectory | Out-Null

                      gh run download $runId `
                          --repo $repository `
                          --name "runner-selection" `
                          --dir $selectionDirectory

                      if ($LASTEXITCODE -ne 0) {
                          throw "Selection download failed."
                      }

                      $selectionPath = Join-Path `
                          $selectionDirectory "selection.json"

                      $selection = Get-Content `
                          -Path $selectionPath -Raw |
                          ConvertFrom-Json

                      break
                  }
                  catch {
                      Write-Warning $_.Exception.Message
                  }
              }

              Write-Host "Waiting for runner selection..."
              Start-Sleep -Seconds 5
          }

          if ($null -eq $selection) {
              throw "Runner selection timed out."
          }

          $selectedId = [int]$selection.SelectedCandidateId
          $selected = $candidateId -eq $selectedId

          Write-Host "Selected candidate: $selectedId"
          Write-Host "This candidate: $candidateId"
          Write-Host "Selected: $selected"

          "selected=$($selected.ToString().ToLowerInvariant())" |
              Out-File -FilePath $env:GITHUB_OUTPUT `
                  -Append -Encoding utf8

      - name: Run selected candidate
        if: steps.selection.outputs.selected == 'true'
        shell: pwsh
        run: |
          $processor = Get-CimInstance Win32_Processor |
              Select-Object -First 1

          Write-Host "========================================"
          Write-Host "RUNNER REROLL SUCCESS"
          Write-Host "========================================"
          Write-Host "Candidate: $env:CANDIDATE_ID"
          Write-Host "CPU: $($processor.Name.Trim())"
          Write-Host "Runner: $env:RUNNER_NAME"
          Write-Host "========================================"

          Write-Host "Simulating Scenario Runner execution..."
          Start-Sleep -Seconds 10
          Write-Host "Selected runner completed successfully."

      - name: Report rejected candidate
        if: steps.selection.outputs.selected == 'false'
        shell: pwsh
        run: |
          Write-Host "Candidate $env:CANDIDATE_ID rejected."
          Write-Host "Benchmark data was preserved."

  selector:
    name: Select runner
    runs-on: ubuntu-latest
    timeout-minutes: 12

    env:
      GH_TOKEN: ${{ github.token }}
      SELECTION_MODE: ${{ inputs.selection_mode }}

    steps:
      - name: Checkout selection script and CPU catalog
        uses: actions/checkout@v7
        with:
          sparse-checkout: |
            Script/RunnerSelection/SelectRunner.ps1
            Data/RunnerPerformance/CpuCatalog.json
          sparse-checkout-cone-mode: false

      - name: Wait for candidates
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p candidates
          deadline=$((SECONDS + 480))

          while (( SECONDS < deadline )); do
            names=$(gh api \
              "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" \
              --jq '.artifacts[].name')

            count=0
            for id in 1 2 3 4 5; do
              if grep -Fxq "runner-candidate-$id" <<< "$names"; then
                count=$((count + 1))
              fi
            done

            echo "Candidates published: $count / 5"

            if (( count == 5 )); then
              break
            fi

            sleep 5
          done

          if (( count != 5 )); then
            echo "Timed out waiting for candidates."
            exit 1
          fi

          for id in 1 2 3 4 5; do
            mkdir -p "candidates/$id"

            gh run download "$GITHUB_RUN_ID" \
              --repo "$GITHUB_REPOSITORY" \
              --name "runner-candidate-$id" \
              --dir "candidates/$id"
          done

      - name: Select candidate
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          ./Script/RunnerSelection/SelectRunner.ps1 `
              -SelectionMode $env:SELECTION_MODE `
              -CandidatesDirectory "candidates" `
              -CatalogPath "Data/RunnerPerformance/CpuCatalog.json" `
              -OutputDirectory "RunnerSelection" `
              -ExpectedCandidates 5

      - name: Publish selection
        uses: actions/upload-artifact@v4
        with:
          name: runner-selection
          path: RunnerSelection/
          retention-days: 7
          if-no-files-found: error
