name: Scenario Runner Batch

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag, or commit SHA to test"
        required: true
        default: "master"
        type: string
      enable_live_stream:
        description: "Stream to YouTube Live (do not start consecutive live runs)"
        required: true
        default: false
        type: boolean
  
  workflow_call:
    inputs:
      ref:
        required: true
        type: string
      enable_live_stream:
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: ${{ inputs.enable_live_stream && 'scenario-runner-batch-live' || github.run_id }}
  cancel-in-progress: false

jobs:
  scenario-batch:
    runs-on: windows-2025-vs2026
    timeout-minutes: 45

    env:
      ENABLE_LIVE_STREAM: ${{ inputs.enable_live_stream }}
      YOUTUBE_STREAM_KEY: ${{ secrets.YOUTUBE_STREAM_KEY }}
      YOUTUBE_RTMPS_URL: rtmps://a.rtmps.youtube.com/live2

    steps:
      - name: Verify live stream configuration
        if: inputs.enable_live_stream
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:YOUTUBE_STREAM_KEY)) {
              throw "Repository secret YOUTUBE_STREAM_KEY is not configured."
          }

          Write-Host "YouTube live streaming is enabled."

      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v3
        with:
          msbuild-architecture: x64

      - name: Setup NuGet
        uses: nuget/setup-nuget@v3
        with:
          nuget-version: latest

      - name: Install FFmpeg
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $ffmpegUrl = "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-n9.0-latest-win64-gpl-9.0.zip"
          $ffmpegDirectory = Join-Path $PWD "Tools\FFmpeg"
          $archivePath = Join-Path $env:RUNNER_TEMP "ffmpeg.zip"
          $extractDirectory = Join-Path $env:RUNNER_TEMP "ffmpeg-extracted"

          New-Item -ItemType Directory -Force -Path $ffmpegDirectory | Out-Null

          Invoke-WebRequest -Uri $ffmpegUrl -OutFile $archivePath

          Expand-Archive -Path $archivePath -DestinationPath $extractDirectory -Force

          $ffmpegExecutable = Get-ChildItem -Path $extractDirectory -Filter "ffmpeg.exe" -Recurse -File |
              Select-Object -First 1

          if ($null -eq $ffmpegExecutable) {
              throw "FFmpeg executable was not found in the archive."
          }

          Copy-Item $ffmpegExecutable.FullName (Join-Path $ffmpegDirectory "ffmpeg.exe")

          $installedFFmpeg = Join-Path $ffmpegDirectory "ffmpeg.exe"

          if (-not (Test-Path $installedFFmpeg)) {
              throw "FFmpeg installation failed."
          }

          $versionOutput = & $installedFFmpeg -version

          if ($LASTEXITCODE -ne 0) {
              throw "FFmpeg verification failed."
          }

          Write-Host ($versionOutput | Select-Object -First 1)
          Write-Host "FFmpeg installation completed."

      - name: Restore SaveData packages
        shell: pwsh
        run: |
          if (Test-Path "SaveData/packages.config") {
              nuget restore SaveData/packages.config -PackagesDirectory packages

              if ($LASTEXITCODE -ne 0) {
                  throw "SaveData NuGet restore failed."
              }
          }
          else {
              Write-Host "SaveData/packages.config not found. Skipping restore."
          }

      - name: Build ShikigamiApp
        shell: pwsh
        run: msbuild ShikigamiApp.slnx /m /p:Configuration=Release /p:Platform=x64

      - name: Build ScenarioRunner CLI
        shell: pwsh
        run: msbuild ScenarioRunner.slnx /restore /m /p:Configuration=ReleaseCli /p:Platform=x64

      - name: Verify binaries
        shell: pwsh
        run: |
          if (-not (Test-Path "Gui\bin\x64\Release\Gui.exe")) {
              throw "Gui.exe was not built."
          }

          if (-not (Test-Path "ScenarioRunnerCli\bin\x64\Release\ScenarioRunnerCli.exe")) {
              throw "ScenarioRunnerCli.exe was not built."
          }

          if (-not (Test-Path "Tools\FFmpeg\ffmpeg.exe")) {
              throw "FFmpeg.exe was not installed."
          }

      - name: Run Scenario Batch with recording
        id: scenario_batch
        shell: pwsh
        run: |
          $enableLiveStream = $env:ENABLE_LIVE_STREAM -eq "true"

          $videoDirectory = Join-Path $PWD "ScenarioVideo"
          $videoPath = "ScenarioVideo/ScenarioBatch.mp4"
          $overlayPath = Join-Path $videoDirectory "current_scenario.txt"
          $tempOverlayPath = Join-Path $videoDirectory "current_scenario.tmp"
          $fontPath = Join-Path $videoDirectory "overlay.ttf"

          New-Item -ItemType Directory -Force -Path $videoDirectory | Out-Null
          Copy-Item "C:\Windows\Fonts\arial.ttf" $fontPath

          $utf8 = [System.Text.UTF8Encoding]::new($false)

          [System.IO.File]::WriteAllText(
              $overlayPath,
              "Waiting for Scenario Runner...",
              $utf8
          )

          # The drawtext filter reloads this file while the batch is running.
          # A temporary sharing violation must not abort the E2E run.
          function Update-ScenarioOverlay {
              param([string]$text)

              try {
                  [System.IO.File]::WriteAllText($tempOverlayPath, $text, $utf8)

                  for ($attempt = 1; $attempt -le 10; $attempt++) {
                      try {
                          [System.IO.File]::Move($tempOverlayPath, $overlayPath, $true)
                          return
                      }
                      catch [System.IO.IOException] {
                          if ($attempt -eq 10) { throw }
                      }
                      catch [System.UnauthorizedAccessException] {
                          if ($attempt -eq 10) { throw }
                      }

                      Start-Sleep -Milliseconds 100
                  }
              }
              catch {
                  Write-Warning "Overlay update skipped after retries: $($_.Exception.Message)"
              }
          }

          # Use relative paths to avoid Windows drive-letter escaping.
          $drawText = "drawtext=fontfile=ScenarioVideo/overlay.ttf:textfile=ScenarioVideo/current_scenario.txt:reload=1:fontcolor=white:fontsize=26:box=1:boxcolor=black@0.75:boxborderw=12:x=20:y=20"

          # The capture and encoding settings are shared by both modes.
          $ffmpegArguments = "-hide_banner -loglevel quiet -nostats -y -f gdigrab -framerate 5 -draw_mouse 1 -i desktop -f lavfi -i anullsrc=channel_layout=stereo:sample_rate=44100 -map 0:v:0 -map 1:a:0 -vf `"$drawText`" -c:v libx264 -preset ultrafast -pix_fmt yuv420p -b:v 1800k -maxrate 1800k -bufsize 3600k -g 10 -flags +global_header -c:a aac -b:a 128k -ar 44100"

          if ($enableLiveStream) {
              $streamUrl = "$env:YOUTUBE_RTMPS_URL/$env:YOUTUBE_STREAM_KEY"

              # Record locally even if the RTMPS output fails.
              # The tee muxer shares one encoded stream.
              $teeOutput = "[f=mp4]$videoPath|[f=flv:onfail=ignore]$streamUrl"

              $ffmpegArguments += " -f tee `"$teeOutput`""

              Write-Host "Recording and YouTube live streaming are enabled."
          }
          else {
              $ffmpegArguments += " -f mp4 `"$videoPath`""

              Write-Host "Recording is enabled. YouTube live streaming is disabled."
          }

          # Never print FFmpeg arguments because live mode includes the stream key.
          $ffmpegInfo = New-Object System.Diagnostics.ProcessStartInfo
          $ffmpegInfo.FileName = (Resolve-Path ".\Tools\FFmpeg\ffmpeg.exe").Path
          $ffmpegInfo.Arguments = $ffmpegArguments
          $ffmpegInfo.UseShellExecute = $false
          $ffmpegInfo.RedirectStandardInput = $true
          $ffmpegInfo.RedirectStandardOutput = $false
          $ffmpegInfo.RedirectStandardError = $false

          $ffmpeg = New-Object System.Diagnostics.Process
          $ffmpeg.StartInfo = $ffmpegInfo
          $ffmpegStarted = $false

          $scenarioProcess = $null
          $scenarioExitCode = 1
          $streamFailed = $false
          $lastScenarioName = $null
          $lastScenarioResult = $null
          $batchResult = $null

          try {
              Write-Host "Starting FFmpeg."

              $ffmpegStarted = $ffmpeg.Start()
              if (-not $ffmpegStarted) {
                  throw "Failed to start FFmpeg."
              }

              # Live mode needs time to establish the RTMPS connection.
              $startupWaitSeconds = if ($enableLiveStream) { 5 } else { 1 }

              Start-Sleep -Seconds $startupWaitSeconds

              if ($ffmpeg.HasExited) {
                  throw "FFmpeg exited before Scenario Runner started."
              }

              Write-Host "Starting Scenario Runner Batch."

              $scenarioInfo = New-Object System.Diagnostics.ProcessStartInfo
              $scenarioInfo.FileName = (Resolve-Path ".\ScenarioRunnerCli\bin\x64\Release\ScenarioRunnerCli.exe").Path
              $scenarioInfo.Arguments = '--run-directory ".\Scenario"'
              $scenarioInfo.UseShellExecute = $false
              $scenarioInfo.RedirectStandardOutput = $true
              $scenarioInfo.RedirectStandardError = $false

              $scenarioProcess = New-Object System.Diagnostics.Process
              $scenarioProcess.StartInfo = $scenarioInfo

              if (-not $scenarioProcess.Start()) {
                  throw "Failed to start Scenario Runner."
              }

              # Observe existing console output without modifying Scenario Runner.
              while ($null -ne ($line = $scenarioProcess.StandardOutput.ReadLine())) {
                  Write-Host $line

                  if ($line.StartsWith("[Batch] Running: ", [System.StringComparison]::Ordinal)) {
                      $lastScenarioName = $line.Substring("[Batch] Running: ".Length).Replace("\", "/")
                      $lastScenarioResult = "RUNNING"

                      Update-ScenarioOverlay -text $lastScenarioName
                  }
                  elseif ($line.StartsWith("[Batch] PASS: ", [System.StringComparison]::Ordinal)) {
                      $lastScenarioResult = "PASS"
                  }
                  elseif ($line.StartsWith("[Batch] FAIL: ", [System.StringComparison]::Ordinal)) {
                      $lastScenarioResult = "FAIL"
                  }
                  elseif ($line.StartsWith("Batch Result: ", [System.StringComparison]::Ordinal)) {
                      $batchResult = $line.Substring("Batch Result: ".Length).Trim()
                  }

                  if ($ffmpeg.HasExited) {
                      $streamFailed = $true
                  }
              }

              $scenarioProcess.WaitForExit()
              $scenarioExitCode = $scenarioProcess.ExitCode
              $streamFailed = $streamFailed -or $ffmpeg.HasExited

              if (-not $ffmpeg.HasExited) {
                  if ([string]::IsNullOrWhiteSpace($batchResult)) {
                      $batchResult = if ($scenarioExitCode -eq 0) { "PASS" } else { "FAIL" }
                  }

                  if ([string]::IsNullOrWhiteSpace($lastScenarioResult)) {
                      $lastScenarioResult = "UNKNOWN"
                  }

                  $finalOverlay = "Batch: $batchResult"

                  if (-not [string]::IsNullOrWhiteSpace($lastScenarioName)) {
                      $finalOverlay += "`nLast: $lastScenarioName [$lastScenarioResult]"
                  }

                  Update-ScenarioOverlay -text $finalOverlay

                  # Hold the final result after Scenario Runner has finished.
                  Write-Host "Holding the final result for 3 seconds."
                  Start-Sleep -Seconds 3
              }
          }
          finally {
              if ($null -ne $scenarioProcess) {
                  if (-not $scenarioProcess.HasExited) {
                      $scenarioProcess.Kill()
                      $scenarioProcess.WaitForExit()
                  }

                  $scenarioProcess.Dispose()
              }

              if ($ffmpegStarted -and -not $ffmpeg.HasExited) {
                  try {
                      $ffmpeg.StandardInput.WriteLine("q")
                      $ffmpeg.StandardInput.Flush()

                      if (-not $ffmpeg.WaitForExit(10000)) {
                          $ffmpeg.Kill()
                          $ffmpeg.WaitForExit()
                      }
                  }
                  catch {
                      if (-not $ffmpeg.HasExited) {
                          $ffmpeg.Kill()
                          $ffmpeg.WaitForExit()
                      }

                      throw
                  }
              }

              $ffmpeg.Dispose()
          }

          if ($scenarioExitCode -ne 0) {
              throw "Scenario Runner Batch failed with exit code $scenarioExitCode."
          }

          if ($streamFailed) {
              throw "FFmpeg stopped before Scenario Runner finished."
          }

          if (-not (Test-Path $videoPath)) {
              throw "MP4 recording was not created."
          }

          Write-Host "Scenario Runner Batch and recording completed."

      - name: Upload Scenario Batch video
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scenario-runner-batch-video
          path: ScenarioVideo\ScenarioBatch.mp4
          if-no-files-found: warn

      - name: Upload failure captures
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: scenario-runner-batch-captures
          path: ScenarioRunnerCli\bin\x64\Release\Capture
          if-no-files-found: ignore

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scenario-runner-batch-logs
          path: |
            ScenarioRunnerCli\bin\x64\Release\Log
            Gui\bin\x64\Release\Log
          if-no-files-found: ignore

      - name: Prepare failure reproduction package
        if: ${{ failure() && steps.scenario_batch.outcome == 'failure' }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $packageDirectory = Join-Path $PWD "FailureReproduction"
          $guiSourceDirectory = Join-Path $PWD "Gui\bin\x64\Release"
          $cliSourceDirectory = Join-Path $PWD "ScenarioRunnerCli\bin\x64\Release"
          $scenarioSourceDirectory = Join-Path $PWD "Scenario"

          $guiTargetDirectory = Join-Path $packageDirectory "Gui"
          $cliTargetDirectory = Join-Path $packageDirectory "ScenarioRunnerCli"
          $scenarioTargetDirectory = Join-Path $packageDirectory "Scenario"

          $requiredPaths = @(
              (Join-Path $guiSourceDirectory "Gui.exe"),
              (Join-Path $cliSourceDirectory "ScenarioRunnerCli.exe"),
              $scenarioSourceDirectory
          )

          foreach ($path in $requiredPaths) {
              if (-not (Test-Path -LiteralPath $path)) {
                  throw "Required reproduction input was not found: $path"
              }
          }

          New-Item -ItemType Directory -Force -Path $guiTargetDirectory | Out-Null
          New-Item -ItemType Directory -Force -Path $cliTargetDirectory | Out-Null
          New-Item -ItemType Directory -Force -Path $scenarioTargetDirectory | Out-Null

          # Copy the binaries and their sidecar files, but not runtime logs or captures.
          $binaryExtensions = @(
              ".exe",
              ".dll",
              ".config",
              ".json",
              ".pdb",
              ".xml",
              ".manifest"
          )

          $binaryDirectories = @(
              @{
                  Source = $guiSourceDirectory
                  Target = $guiTargetDirectory
              },
              @{
                  Source = $cliSourceDirectory
                  Target = $cliTargetDirectory
              }
          )

          foreach ($directory in $binaryDirectories) {
              Get-ChildItem -LiteralPath $directory.Source -File |
                  Where-Object { $_.Extension -in $binaryExtensions } |
                  ForEach-Object {
                      Copy-Item -LiteralPath $_.FullName -Destination $directory.Target -Force
                  }
          }

          # Include application data needed to launch Gui.
          $guiDataSourceDirectory = Join-Path $guiSourceDirectory "Data"
          $guiDataTargetDirectory = Join-Path $guiTargetDirectory "Data"

          if (-not (Test-Path -LiteralPath $guiDataSourceDirectory)) {
              throw "Gui Data directory was not found."
          }

          New-Item -ItemType Directory -Force -Path $guiDataTargetDirectory | Out-Null

          Get-ChildItem -LiteralPath $guiDataSourceDirectory -File |
              Where-Object { $_.Extension -in @(".csv", ".txt", ".json") } |
              ForEach-Object {
                  Copy-Item -LiteralPath $_.FullName -Destination $guiDataTargetDirectory -Force
              }

          # Copy scenario definitions and test data, excluding generated production files.
          Get-ChildItem -LiteralPath $scenarioSourceDirectory -Force |
              Where-Object { $_.Name -ne "production" } |
              ForEach-Object {
                  Copy-Item -LiteralPath $_.FullName `
                      -Destination $scenarioTargetDirectory `
                      -Recurse -Force
              }

          $scenarioFiles = @(
              Get-ChildItem -LiteralPath $scenarioTargetDirectory `
                  -Filter "*.scenario" -File -Recurse
          )

          if ($scenarioFiles.Count -eq 0) {
              throw "No scenario files were found."
          }

          # Validate the minimum reproduction package.
          $requiredPackagePaths = @(
              (Join-Path $guiTargetDirectory "Gui.exe"),
              (Join-Path $cliTargetDirectory "ScenarioRunnerCli.exe"),
              (Join-Path $guiDataTargetDirectory "ShikigamiData.csv")
          )

          foreach ($path in $requiredPackagePaths) {
              if (-not (Test-Path -LiteralPath $path)) {
                  throw "Required file is missing from reproduction package: $path"
              }
          }

          # Record the commit actually checked out, not only the workflow commit.
          $checkoutCommit = (& git rev-parse HEAD).Trim()

          if ($LASTEXITCODE -ne 0) {
              throw "Failed to resolve checkout commit."
          }

          $operatingSystem = Get-CimInstance Win32_OperatingSystem
          $dotNetRelease = Get-ItemPropertyValue `
              -Path "HKLM:\SOFTWARE\Microsoft\NET Framework Setup\NDP\v4\Full" `
              -Name Release `
              -ErrorAction SilentlyContinue

          Add-Type -AssemblyName System.Windows.Forms
          $screen = [System.Windows.Forms.Screen]::PrimaryScreen

          $metadata = @(
              "Repository: $env:GITHUB_REPOSITORY"
              "Checkout Commit: $checkoutCommit"
              "Workflow Commit: $env:GITHUB_SHA"
              "Requested Ref: ${{ inputs.ref }}"
              "Workflow Run ID: $env:GITHUB_RUN_ID"
              "Workflow Attempt: $env:GITHUB_RUN_ATTEMPT"
              "Runner Name: $env:RUNNER_NAME"
              "Runner OS: $env:RUNNER_OS"
              "Runner Image: $env:ImageOS"
              "Runner Image Version: $env:ImageVersion"
              "Windows: $($operatingSystem.Caption)"
              "Windows Version: $($operatingSystem.Version)"
              ".NET Framework Release: $dotNetRelease"
              "PowerShell: $($PSVersionTable.PSVersion)"
              "Primary Screen Bounds: $($screen.Bounds)"
              "Primary Screen Working Area: $($screen.WorkingArea)"
              "Scenario Count: $($scenarioFiles.Count)"
          )

          $metadata |
              Set-Content -LiteralPath (Join-Path $packageDirectory "Environment.txt") -Encoding utf8

          # Provide a standalone command for local reproduction.
          $reproductionScript = @'
          @echo off
          setlocal
          cd /d "%~dp0"

          "ScenarioRunnerCli\ScenarioRunnerCli.exe" --run-directory "Scenario" --gui-path "Gui\Gui.exe"

          set "EXIT_CODE=%ERRORLEVEL%"
          echo.
          echo Scenario Runner exit code: %EXIT_CODE%
          pause
          exit /b %EXIT_CODE%
          '@

          $reproductionScript |
              Set-Content -LiteralPath (Join-Path $packageDirectory "Reproduce.bat") -Encoding ascii

          # Record hashes using paths relative to the package root.
          $hashLines = @(
              Get-ChildItem -LiteralPath $packageDirectory -Recurse -File |
                  Where-Object { $_.Name -ne "SHA256.txt" } |
                  Sort-Object FullName |
                  ForEach-Object {
                      $hash = Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256
                      $relativePath = $_.FullName.Substring($packageDirectory.Length + 1)
                      "$($hash.Hash)  $relativePath"
                  }
          )

          $hashLines |
              Set-Content -LiteralPath (Join-Path $packageDirectory "SHA256.txt") -Encoding utf8

          Write-Host "Failure reproduction package prepared."
          Write-Host "Checkout commit: $checkoutCommit"
          Write-Host "Scenario count: $($scenarioFiles.Count)"
          Write-Host "Package files: $($hashLines.Count + 1)"

      - name: Upload failure reproduction package
        if: ${{ failure() && steps.scenario_batch.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: scenario-runner-batch-reproduction
          path: FailureReproduction/
          retention-days: 90
          if-no-files-found: error

